[project]
head-extra = '<script defer src="https://um.yawk.at/script.js" data-website-id="b5d4c506-bc83-46c4-a1d0-84defbe9736d"></script>'

[openscad.libraries.bosl2]
commit = "fbcdfdd511b6abfde93c43c8f85c2bd24ee7a02d"

[cadquery]
# uv project (pyproject.toml + uv.lock) with the CadQuery models' dependencies
project = "examples/cadquery"
# OCP.wasm reduced to the modules CadQuery uses (https://github.com/yawkat/ocp-wasm-cadquery)
ocp-wheel = { url = "https://github.com/yawkat/ocp-wasm-cadquery/releases/download/7.9.3.1-cadquery2.8.0-2/cadquery_ocp_novtk_ocp_wasm-7.9.3.1%2Bcadquery2.8.0-cp314-cp314-pyemscripten_2026_0_wasm32.whl", sha256 = "c49006b18d598a764240ffc562de13415a5de5710ab1941befdee24143d59298" }

[[model]]
file = "test.scad"
index = true
preview-style = "colors"
export-file-stem = {js = "shape + '-' + width + 'x' + depth + 'x' + height"}
# Track render events with selected model parameters
umami-track-render = ["shape", "width", "depth", "height"]
# Track export events with additional parameters
umami-track-export = ["shape", "width", "depth", "height", "rounding"]

[[model]]
file = "examples/cadquery/enclosure.py"
runtime = "cadquery"
preview-style = "colors"
export-file-stem = {js = "'enclosure-' + size[0] + 'x' + size[1] + 'x' + height"}

# Put the "show lid" checkbox into the tab header
[model.tab-metadata."Lid"]
control-boolean = "lid.show"

[model.param-metadata."lid.*"]
display-condition = {js = "lid.show"}

[model.param-metadata."lid.show"]
display-condition = {fixed = false}
